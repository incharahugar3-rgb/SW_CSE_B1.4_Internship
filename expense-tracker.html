<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ExpenseFlow | Expense Tracker</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#f4f5f7;font-family:Inter,system-ui,sans-serif}.app{width:min(1050px,92%);margin:45px auto 80px}header{display:flex;justify-content:space-between;align-items:end;margin-bottom:30px}.eyebrow{font-size:11px;letter-spacing:2px;color:#8fd3ff;font-weight:800}h1{font-size:50px;line-height:1;margin:5px 0}h1 span{color:#8fd3ff}.ghost{background:transparent;border:1px solid #303640;color:#aeb5c0;padding:10px 15px;border-radius:9px}.summary{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;margin-bottom:18px}.summary>div,.panel{background:#11151b;border:1px solid #292f38;border-radius:16px;padding:22px}.summary small{display:block;color:#8e96a2;margin-bottom:7px}.summary strong{font-size:25px}.balance strong{font-size:36px}.panel{margin-top:18px}.panel h2{margin:0 0 18px;font-size:20px}form{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr auto;gap:10px}input,select{width:100%;padding:12px;border-radius:9px;border:1px solid #303640;background:#0c0f13;color:#fff;outline:none}input:focus,select:focus{border-color:#8fd3ff}.add{border:0;border-radius:9px;padding:12px 17px;font-weight:800;background:#8fd3ff;color:#0b0d10}.toolbar{display:flex;justify-content:space-between;gap:20px;align-items:center}.toolbar input{max-width:230px}.item{display:flex;justify-content:space-between;align-items:center;padding:17px 0;border-top:1px solid #252a32}.item-left{display:flex;gap:13px;align-items:center}.icon{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:#1b222b;color:#8fd3ff}.item b{display:block}.item small{color:#7e8794}.amount{font-weight:900}.income{color:#86d8a0}.expense{color:#ff9b9b}.delete{background:transparent;border:0;color:#717a86;font-size:17px;margin-left:14px}.empty{text-align:center;color:#737c88;padding:35px 10px}@media(max-width:850px){form{grid-template-columns:1fr 1fr}.add{grid-column:1/-1}.summary{grid-template-columns:1fr 1fr}.balance{grid-column:1/-1}}@media(max-width:560px){.app{width:94%;margin-top:25px}header{align-items:center}.summary{grid-template-columns:1fr}.balance{grid-column:auto}.toolbar{align-items:stretch;flex-direction:column}.toolbar input{max-width:none}form{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app"><header><div><p class="eyebrow">PERSONAL FINANCE</p><h1>Expense<span>Flow</span></h1></div><button id="clearAll" class="ghost">Clear all</button></header>
<section class="summary"><div class="balance"><small>Current balance</small><strong id="balance">₹0</strong></div><div><small>Income</small><strong id="income">₹0</strong></div><div><small>Expenses</small><strong id="expense">₹0</strong></div></section>
<section class="panel"><h2>Add transaction</h2><form id="form"><input id="description" placeholder="Description" required><input id="amount" type="number" min="1" step="0.01" placeholder="Amount (₹)" required><select id="type"><option value="expense">Expense</option><option value="income">Income</option></select><select id="category"><option>Food</option><option>Transport</option><option>Education</option><option>Shopping</option><option>Entertainment</option><option>Bills</option><option>Other</option></select><button class="add">Add transaction</button></form></section>
<section class="panel"><div class="toolbar"><h2>Transactions</h2><input id="search" placeholder="Search..."></div><div id="empty" class="empty">No transactions yet. Add your first one above.</div><div id="list"></div></section></div>
<script>
const KEY="expenseflow.transactions.v1";let transactions=JSON.parse(localStorage.getItem(KEY)||"[]");const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(transactions))}
function money(n){return new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR",maximumFractionDigits:2}).format(n)}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function render(){const q=$("search").value.toLowerCase();const filtered=transactions.filter(t=>(t.description+" "+t.category).toLowerCase().includes(q));const inc=transactions.filter(t=>t.type==="income").reduce((s,t)=>s+t.amount,0);const exp=transactions.filter(t=>t.type==="expense").reduce((s,t)=>s+t.amount,0);$("income").textContent=money(inc);$("expense").textContent=money(exp);$("balance").textContent=money(inc-exp);$("empty").style.display=filtered.length?"none":"block";$("list").innerHTML=filtered.map(t=>`<div class="item"><div class="item-left"><div class="icon">${t.type==="income"?"↑":"↓"}</div><div><b>${escapeHtml(t.description)}</b><small>${escapeHtml(t.category)} · ${t.date}</small></div></div><div><span class="amount ${t.type}">${t.type==="income"?"+":"−"}${money(t.amount)}</span><button class="delete" data-id="${t.id}">×</button></div></div>`).join("");document.querySelectorAll(".delete").forEach(b=>b.onclick=()=>{transactions=transactions.filter(t=>t.id!==b.dataset.id);save();render()})}
$("form").onsubmit=e=>{e.preventDefault();const amount=Number($("amount").value);if(!amount||amount<=0)return;transactions.unshift({id:crypto.randomUUID(),description:$("description").value.trim(),amount,type:$("type").value,category:$("category").value,date:new Date().toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"})});save();e.target.reset();render()};
$("search").oninput=render;$("clearAll").onclick=()=>{if(transactions.length&&confirm("Delete all transactions?")){transactions=[];save();render()}};render();
</script>
</body></html>
