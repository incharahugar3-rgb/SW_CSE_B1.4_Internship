<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ExpenseFlow | Expense Tracker</title><link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header><div><p class="eyebrow">PERSONAL FINANCE</p><h1>Expense<span>Flow</span></h1></div><button id="clearAll" class="ghost">Clear all</button></header>
  <section class="summary">
    <div class="balance"><small>Current balance</small><strong id="balance">₹0</strong></div>
    <div><small>Income</small><strong id="income">₹0</strong></div>
    <div><small>Expenses</small><strong id="expense">₹0</strong></div>
  </section>
  <section class="panel">
    <h2>Add transaction</h2>
    <form id="form">
      <input id="description" placeholder="Description" required>
      <input id="amount" type="number" min="1" step="0.01" placeholder="Amount (₹)" required>
      <select id="type"><option value="expense">Expense</option><option value="income">Income</option></select>
      <select id="category"><option>Food</option><option>Transport</option><option>Education</option><option>Shopping</option><option>Entertainment</option><option>Bills</option><option>Other</option></select>
      <button class="add">Add transaction</button>
    </form>
  </section>
  <section class="panel">
    <div class="toolbar"><h2>Transactions</h2><input id="search" placeholder="Search..."></div>
    <div id="empty" class="empty">No transactions yet. Add your first one above.</div>
    <div id="list"></div>
  </section>
</div>
<script src="script.js"></script>
</body>
</html>
